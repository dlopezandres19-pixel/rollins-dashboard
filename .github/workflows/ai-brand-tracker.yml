name: AI Brand Visibility Tracker

# Runs every Friday at 07:00 UTC (3:00 AM ET / 9:00 AM CET)
# Also supports manual runs via workflow_dispatch

on:
  schedule:
    - cron: "0 7 * * 5"   # Every Friday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in DRY_RUN mode (no API calls)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      providers:
        description: "Comma-separated providers to run (default: openai,anthropic,gemini)"
        required: false
        default: "openai,anthropic,gemini"
      runs_per_prompt:
        description: "Repetitions per prompt (default: 5)"
        required: false
        default: "5"

# Prevent concurrent runs that could corrupt master data files
concurrency:
  group: ai-brand-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    name: Weekly AI Brand Visibility Run
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write   # needed to commit CSVs back to the repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so append-only master files stay intact
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-brand-tracker/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai-brand-tracker/requirements.txt

      # ── 4. Run tracker ───────────────────────────────────────────────────
      - name: Run AI Brand Visibility Tracker
        working-directory: ai-brand-tracker
        env:
          # API Keys (stored as GitHub Secrets)
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}

          # Model IDs (stored as GitHub Variables — change without code edits)
          OPENAI_MODEL:    ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL:    ${{ vars.GEMINI_MODEL }}

          # Run configuration
          DRY_RUN:          ${{ github.event.inputs.dry_run || 'false' }}
          PROVIDERS:        ${{ github.event.inputs.providers || 'openai,anthropic,gemini' }}
          RUNS_PER_PROMPT:  ${{ github.event.inputs.runs_per_prompt || '5' }}

          # Tunable settings (env vars with defaults in code)
          MAX_OUTPUT_TOKENS:  "512"
          LLM_TEMPERATURE:    "0.3"
          RETRY_MAX:          "3"
          RETRY_BASE_SECONDS: "5"

        run: |
          python src/run_tracker.py

      # ── 5. Commit new data files back to the repo ────────────────────────
      - name: Commit weekly data files
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the data files (never source code or secrets)
          git add ai-brand-tracker/data/raw/
          git add ai-brand-tracker/data/weekly/
          git add ai-brand-tracker/data/master/

          # Only commit if there is something new
          if git diff --staged --quiet; then
            echo "No new data files — nothing to commit."
          else
            RUN_DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: ai-brand-tracker weekly run ${RUN_DATE} [skip ci]"
            git push
          fi
