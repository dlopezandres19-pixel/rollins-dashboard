name: AI Regional Brand Tracker

on:
  schedule:
    # Every Monday at 06:00 UTC (01:00 Lima time)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to run (leave blank for all)"
        required: false
        default: ""
      region:
        description: "Region ID to run (leave blank for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no API calls)"
        required: false
        default: "false"
        type: boolean

jobs:
  run-tracker:
    name: Run regional tracker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-regional-tracker/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r ai-regional-tracker/requirements.txt

      - name: Run tracker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: ai-regional-tracker/src
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.provider }}" ]; then
            ARGS="$ARGS --provider ${{ github.event.inputs.provider }}"
          fi
          if [ -n "${{ github.event.inputs.region }}" ]; then
            ARGS="$ARGS --region ${{ github.event.inputs.region }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python run_tracker.py $ARGS

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Show what files were written
          echo "=== Files in data/ ==="
          find ai-regional-tracker/data -type f 2>/dev/null || echo "(none)"
          # Only add data/ if it exists (dry-run produces no files)
          if [ -d "ai-regional-tracker/data" ]; then
            git add ai-regional-tracker/data/
          fi
          echo "=== Staged changes ==="
          git status --short
          # Commit if there are staged changes, then push
          if ! git diff --cached --quiet; then
            git commit -m "chore: regional tracker run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new data to commit."
          fi
